<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#003f6b;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#005a87;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#007ab5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="leg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e6f4ff;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#c9e6f7;stop-opacity:0.9" />
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)" />
  <circle cx="700" cy="60" r="120" fill="#007ab5" opacity="0.25"/>
  <circle cx="740" cy="320" r="80" fill="#abce5f" opacity="0.12"/>
  <circle cx="80" cy="350" r="100" fill="#005a87" opacity="0.3"/>
  <circle cx="50" cy="80" r="60" fill="#abce5f" opacity="0.1"/>
  <circle cx="600" cy="40" r="4" fill="#abce5f" opacity="0.5"/>
  <circle cx="625" cy="55" r="3" fill="#abce5f" opacity="0.4"/>
  <circle cx="650" cy="35" r="3" fill="#abce5f" opacity="0.5"/>
  <!-- perna estilizada -->
  <g transform="translate(250 40)">
    <path d="M 20 0 L 90 0 Q 95 90 85 160 Q 80 230 78 290 L 120 300 Q 140 310 130 325 L 30 325 Q 20 320 25 300 Q 22 230 18 160 Q 8 90 20 0 Z" fill="url(#leg)" stroke="#ffffff" stroke-width="3" opacity="0.95"/>
    <!-- artéria -->
    <path d="M 55 5 Q 62 90 55 160 Q 50 230 52 300 Q 70 312 110 312" fill="none" stroke="#e05a5a" stroke-width="7" stroke-linecap="round" opacity="0.9"/>
    <!-- placa -->
    <ellipse cx="54" cy="200" rx="9" ry="16" fill="#f2c94c" stroke="#ffffff" stroke-width="2"/>
  </g>
  <!-- transdutor -->
  <g transform="translate(345 210) rotate(-25)">
    <rect x="0" y="0" width="34" height="70" rx="12" fill="#ffffff" opacity="0.9"/>
    <rect x="4" y="-8" width="26" height="14" rx="5" fill="#abce5f"/>
  </g>
  <!-- onda Doppler -->
  <g transform="translate(450 120)">
    <rect x="0" y="0" width="260" height="130" rx="14" fill="#ffffff" opacity="0.12" stroke="#abce5f" stroke-width="2"/>
    <path d="M 15 95 L 45 95 L 55 30 L 68 105 L 80 85 L 110 95 L 120 30 L 133 105 L 145 85 L 175 95 L 185 30 L 198 105 L 210 85 L 245 95" fill="none" stroke="#abce5f" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  </g>
  <!-- gota de glicose -->
  <g transform="translate(580 300)">
    <path d="M 0 -40 Q 28 -5 28 12 A 28 28 0 0 1 -28 12 Q -28 -5 0 -40 Z" fill="#7fc8f8" stroke="#ffffff" stroke-width="3" opacity="0.9"/>
    <circle cx="0" cy="12" r="9" fill="none" stroke="#ffffff" stroke-width="3"/>
  </g>
</svg>
