<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bgEM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#003f6b;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#005a87;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#007ab5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentEM" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff9a3d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffc078;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="screenEM" cx="50%" cy="50%" r="70%">
      <stop offset="0%" style="stop-color:#0a2540;stop-opacity:0.95" />
      <stop offset="60%" style="stop-color:#031426;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#000814;stop-opacity:1" />
    </radialGradient>
    <radialGradient id="brainEM" cx="50%" cy="45%" r="65%">
      <stop offset="0%" style="stop-color:#eaf3ff;stop-opacity:0.95" />
      <stop offset="70%" style="stop-color:#bcd9f5;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#8fb8e0;stop-opacity:0.6" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="url(#bgEM)" />

  <!-- Decorative circles -->
  <circle cx="700" cy="60" r="120" fill="#007ab5" opacity="0.25"/>
  <circle cx="740" cy="320" r="80" fill="#ff9a3d" opacity="0.12"/>
  <circle cx="80" cy="350" r="100" fill="#005a87" opacity="0.3"/>
  <circle cx="50" cy="80" r="60" fill="#ff9a3d" opacity="0.1"/>

  <!-- Decorative dots -->
  <circle cx="600" cy="40" r="4" fill="#ffb066" opacity="0.5"/>
  <circle cx="625" cy="55" r="3" fill="#ffb066" opacity="0.4"/>
  <circle cx="615" cy="75" r="5" fill="#ffb066" opacity="0.3"/>
  <circle cx="650" cy="35" r="3" fill="#ffb066" opacity="0.5"/>

  <!-- MRI viewer screen (left side) showing axial brain with demyelinating plaques -->
  <g transform="translate(60 50)">
    <rect x="0" y="0" width="280" height="240" rx="10" fill="url(#screenEM)" stroke="#ff9a3d" stroke-width="2.5" opacity="0.95"/>

    <!-- Top clips -->
    <rect x="50" y="-6" width="22" height="12" rx="2" fill="#ffffff" opacity="0.7"/>
    <rect x="208" y="-6" width="22" height="12" rx="2" fill="#ffffff" opacity="0.7"/>

    <!-- Skull outline -->
    <ellipse cx="140" cy="120" rx="92" ry="80" fill="none" stroke="#cfe7ff" stroke-width="3" opacity="0.55"/>

    <!-- Brain (axial slice) -->
    <ellipse cx="140" cy="120" rx="80" ry="68" fill="url(#brainEM)" opacity="0.92"/>

    <!-- Central fissure -->
    <path d="M 140 54 L 140 188" stroke="#5e8bc0" stroke-width="2.5" opacity="0.6"/>

    <!-- Gyri / sulci (brain folds) left hemisphere -->
    <g stroke="#5e8bc0" stroke-width="2" fill="none" opacity="0.55">
      <path d="M 75 95 Q 95 85 110 100 Q 95 115 80 110"/>
      <path d="M 72 130 Q 95 122 112 138 Q 92 152 76 146"/>
      <path d="M 82 165 Q 100 160 118 172"/>
      <path d="M 95 75 Q 112 70 122 84"/>
    </g>
    <!-- Gyri / sulci right hemisphere -->
    <g stroke="#5e8bc0" stroke-width="2" fill="none" opacity="0.55">
      <path d="M 205 95 Q 185 85 170 100 Q 185 115 200 110"/>
      <path d="M 208 130 Q 185 122 168 138 Q 188 152 204 146"/>
      <path d="M 198 165 Q 180 160 162 172"/>
      <path d="M 185 75 Q 168 70 158 84"/>
    </g>

    <!-- Ventricles -->
    <path d="M 130 105 Q 122 120 130 138 L 138 138 L 138 105 Z" fill="#9cc0e8" opacity="0.7"/>
    <path d="M 150 105 Q 158 120 150 138 L 142 138 L 142 105 Z" fill="#9cc0e8" opacity="0.7"/>

    <!-- Demyelinating plaques (orange lesions) -->
    <ellipse cx="122" cy="98" rx="7" ry="5" fill="#ff8a3d" opacity="0.9"/>
    <ellipse cx="160" cy="100" rx="6" ry="4" fill="#ff8a3d" opacity="0.9"/>
    <ellipse cx="118" cy="148" rx="5" ry="4" fill="#ffb066" opacity="0.85"/>
    <ellipse cx="168" cy="150" rx="6" ry="4" fill="#ff8a3d" opacity="0.85"/>

    <!-- Highlight ring on one plaque -->
    <circle cx="122" cy="98" r="13" fill="none" stroke="#ff9a3d" stroke-width="1.5" opacity="0.6"/>

    <!-- Label arrow pointing to plaque -->
    <g>
      <path d="M 62 66 L 108 90" fill="none" stroke="#ff9a3d" stroke-width="2" stroke-linecap="round"/>
      <path d="M 102 82 L 110 91 L 100 92" fill="none" stroke="#ff9a3d" stroke-width="2" stroke-linecap="round"/>
      <text x="16" y="62" font-family="Montserrat, Arial, sans-serif" font-size="9" font-weight="700" fill="#ff9a3d">PLACAS</text>
    </g>

    <!-- Labels -->
    <text x="14" y="20" font-family="Montserrat, Arial, sans-serif" font-size="10" font-weight="700"
          fill="#ff9a3d" opacity="0.95">RM FLAIR</text>
    <text x="266" y="20" font-family="Montserrat, Arial, sans-serif" font-size="10" font-weight="700"
          fill="#ff9a3d" opacity="0.95" text-anchor="end">AX</text>
    <text x="140" y="232" font-family="Montserrat, Arial, sans-serif" font-size="9" font-weight="700"
          fill="#ff9a3d" text-anchor="middle" opacity="0.95">CRÂNIO • UNO DIAGNÓSTICO</text>
  </g>

  <!-- Awareness ribbon (Agosto Laranja) -->
  <g transform="translate(590 120)" stroke="#ff9a3d" stroke-width="14" fill="none" stroke-linecap="round" opacity="0.95">
    <path d="M 0 0 C -18 40 -18 70 0 105"/>
    <path d="M 40 0 C 58 40 58 70 40 105"/>
  </g>
  <g transform="translate(590 120)" stroke="#ffc078" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.7">
    <path d="M 0 0 C -18 40 -18 70 0 105"/>
    <path d="M 40 0 C 58 40 58 70 40 105"/>
  </g>

  <!-- Sparkles around ribbon -->
  <circle cx="560" cy="110" r="2.5" fill="#ffb066" opacity="0.75"/>
  <circle cx="660" cy="130" r="2" fill="#ffc078" opacity="0.65"/>
  <circle cx="575" cy="235" r="2" fill="#ffb066" opacity="0.55"/>
  <circle cx="655" cy="225" r="2.5" fill="#ffc078" opacity="0.7"/>

  <!-- Decorative nerve/wave (myelin sheath motif) -->
  <g opacity="0.4" fill="none" stroke="#ff9a3d" stroke-width="2.5" stroke-linecap="round">
    <path d="M 470 250 Q 520 232 560 250 Q 600 268 645 250"/>
    <circle cx="470" cy="250" r="5" fill="#ff9a3d" stroke="none" opacity="0.85"/>
    <circle cx="560" cy="250" r="5" fill="#ff9a3d" stroke="none" opacity="0.85"/>
    <circle cx="645" cy="250" r="5" fill="#ff9a3d" stroke="none" opacity="0.85"/>
  </g>

  <!-- Title -->
  <text x="400" y="325" font-family="Montserrat, Arial, sans-serif" font-size="23" font-weight="800"
        fill="#ffffff" text-anchor="middle">Agosto Laranja: esclerose múltipla</text>

  <!-- Subtitle -->
  <text x="400" y="358" font-family="Open Sans, Arial, sans-serif" font-size="14" font-weight="400"
        fill="#ffc078" text-anchor="middle">A ressonância magnética no diagnóstico precoce</text>

  <!-- Accent line -->
  <rect x="280" y="372" width="240" height="3" rx="1.5" fill="url(#accentEM)" opacity="0.85"/>
</svg>
