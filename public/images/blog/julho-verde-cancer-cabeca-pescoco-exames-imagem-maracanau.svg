<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f6b3f;stop-opacity:1" />
      <stop offset="55%" style="stop-color:#1a8a52;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2aa86a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="ribbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c8e47a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#abce5f;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="nodeGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#dff3c5;stop-opacity:0.85" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="url(#bg)" />

  <!-- Decorative circles -->
  <circle cx="700" cy="60" r="120" fill="#2aa86a" opacity="0.30"/>
  <circle cx="740" cy="320" r="80" fill="#c8e47a" opacity="0.12"/>
  <circle cx="80" cy="350" r="100" fill="#0f6b3f" opacity="0.35"/>
  <circle cx="50" cy="80" r="60" fill="#c8e47a" opacity="0.10"/>

  <!-- Decorative dots -->
  <circle cx="600" cy="40" r="4" fill="#c8e47a" opacity="0.5"/>
  <circle cx="625" cy="55" r="3" fill="#c8e47a" opacity="0.4"/>
  <circle cx="615" cy="75" r="5" fill="#c8e47a" opacity="0.3"/>
  <circle cx="650" cy="35" r="3" fill="#c8e47a" opacity="0.5"/>

  <!-- Head & neck silhouette -->
  <g transform="translate(250 90)">
    <!-- shoulder/neck base -->
    <path d="M-40 230 C-40 150, 30 140, 30 110 L70 110 C70 150, 150 150, 150 230 Z" fill="#ffffff" opacity="0.92"/>
    <!-- head -->
    <circle cx="55" cy="70" r="62" fill="#ffffff" opacity="0.95"/>
    <!-- face hint -->
    <circle cx="40" cy="60" r="5" fill="#1a8a52" opacity="0.6"/>
    <!-- thyroid / neck node region highlighted -->
    <ellipse cx="55" cy="135" rx="22" ry="14" fill="url(#nodeGrad)"/>
    <circle cx="48" cy="135" r="6" fill="#2aa86a" opacity="0.55"/>
    <circle cx="64" cy="138" r="5" fill="#2aa86a" opacity="0.45"/>
  </g>

  <!-- Green awareness ribbon -->
  <g transform="translate(560 150)">
    <path d="M0 0 C-22 30, -22 30, -8 70 L4 64 C-6 36, -6 36, 12 12 Z" fill="url(#ribbon)"/>
    <path d="M40 0 C62 30, 62 30, 48 70 L36 64 C46 36, 46 36, 28 12 Z" fill="url(#ribbon)"/>
    <circle cx="20" cy="14" r="11" fill="#0f6b3f" opacity="0.85"/>
    <circle cx="20" cy="14" r="11" fill="none" stroke="#c8e47a" stroke-width="3"/>
  </g>

  <!-- Scan / pulse line suggesting imaging -->
  <polyline points="40,300 120,300 150,250 185,345 220,300 320,300" fill="none" stroke="#c8e47a" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
  <circle cx="320" cy="300" r="6" fill="#c8e47a"/>
</svg>
