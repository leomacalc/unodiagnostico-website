<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#003f6b;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#005a87;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#007ab5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#abce5f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c8e47a;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="tissueGrad" cx="50%" cy="45%" r="60%">
      <stop offset="0%" style="stop-color:#e6f4ff;stop-opacity:0.95" />
      <stop offset="60%" style="stop-color:#7fb3d5;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#005a87;stop-opacity:0.85" />
    </radialGradient>
    <linearGradient id="screenPanel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.18" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.05" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="url(#bg)" />

  <!-- Decorative circles -->
  <circle cx="700" cy="60" r="120" fill="#007ab5" opacity="0.25"/>
  <circle cx="740" cy="320" r="80" fill="#abce5f" opacity="0.12"/>
  <circle cx="80" cy="350" r="100" fill="#005a87" opacity="0.3"/>
  <circle cx="50" cy="80" r="60" fill="#abce5f" opacity="0.1"/>

  <!-- Decorative dots -->
  <circle cx="600" cy="40" r="4" fill="#abce5f" opacity="0.5"/>
  <circle cx="625" cy="55" r="3" fill="#abce5f" opacity="0.4"/>
  <circle cx="615" cy="75" r="5" fill="#abce5f" opacity="0.3"/>
  <circle cx="650" cy="35" r="3" fill="#abce5f" opacity="0.5"/>

  <!-- Ultrasound screen panel -->
  <g transform="translate(430,70)">
    <rect x="0" y="0" width="300" height="230" rx="14" fill="url(#screenPanel)" stroke="#abce5f" stroke-width="2" opacity="0.9"/>
    <!-- fan-shaped ultrasound sector -->
    <path d="M 150 20 L 40 200 Q 150 235 260 200 Z" fill="url(#tissueGrad)" opacity="0.85"/>
    <!-- scan lines -->
    <path d="M 150 20 L 40 200" stroke="#e6f4ff" stroke-width="1" opacity="0.3"/>
    <path d="M 150 20 L 95 210" stroke="#e6f4ff" stroke-width="1" opacity="0.25"/>
    <path d="M 150 20 L 150 218" stroke="#e6f4ff" stroke-width="1" opacity="0.25"/>
    <path d="M 150 20 L 205 210" stroke="#e6f4ff" stroke-width="1" opacity="0.25"/>
    <path d="M 150 20 L 260 200" stroke="#e6f4ff" stroke-width="1" opacity="0.3"/>
    <!-- suspicious nodule (dark round area) -->
    <circle cx="150" cy="135" r="26" fill="#00243d" opacity="0.85"/>
    <circle cx="150" cy="135" r="26" fill="none" stroke="#abce5f" stroke-width="2.5" stroke-dasharray="5 4"/>
    <!-- measurement calipers -->
    <line x1="120" y1="135" x2="180" y2="135" stroke="#c8e47a" stroke-width="1.5"/>
    <line x1="120" y1="130" x2="120" y2="140" stroke="#c8e47a" stroke-width="1.5"/>
    <line x1="180" y1="130" x2="180" y2="140" stroke="#c8e47a" stroke-width="1.5"/>
  </g>

  <!-- Transducer (probe) -->
  <g transform="translate(150,150)">
    <!-- breast silhouette curve -->
    <path d="M 20 150 Q 10 60 120 55 Q 230 60 210 160 Q 120 200 20 150 Z" fill="#ffffff" opacity="0.12"/>
    <circle cx="120" cy="120" r="10" fill="#ffffff" opacity="0.18"/>
    <!-- probe body -->
    <g transform="rotate(35 120 40)">
      <rect x="100" y="-40" width="40" height="90" rx="10" fill="#e6f4ff" opacity="0.95"/>
      <rect x="104" y="45" width="32" height="16" rx="4" fill="#abce5f"/>
      <rect x="112" y="-70" width="16" height="34" rx="6" fill="#c8e47a" opacity="0.8"/>
    </g>
  </g>

  <!-- Accent bar -->
  <rect x="0" y="378" width="800" height="22" fill="url(#accent)" opacity="0.9"/>
</svg>
