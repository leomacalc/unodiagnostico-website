<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#003f6b;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#005a87;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#007ab5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#abce5f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c8e47a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="screenPanel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.18" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.05" />
    </linearGradient>
    <radialGradient id="hippoGrad" cx="45%" cy="40%" r="65%">
      <stop offset="0%" style="stop-color:#e6f4ff;stop-opacity:0.95" />
      <stop offset="65%" style="stop-color:#abce5f;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#7ba640;stop-opacity:0.9" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="url(#bg)" />

  <!-- Decorative circles -->
  <circle cx="700" cy="60" r="120" fill="#007ab5" opacity="0.25"/>
  <circle cx="740" cy="320" r="80" fill="#abce5f" opacity="0.12"/>
  <circle cx="80" cy="350" r="100" fill="#005a87" opacity="0.3"/>
  <circle cx="50" cy="80" r="60" fill="#abce5f" opacity="0.1"/>

  <!-- Decorative dots -->
  <circle cx="600" cy="40" r="4" fill="#abce5f" opacity="0.5"/>
  <circle cx="625" cy="55" r="3" fill="#abce5f" opacity="0.4"/>
  <circle cx="615" cy="75" r="5" fill="#abce5f" opacity="0.3"/>
  <circle cx="650" cy="35" r="3" fill="#abce5f" opacity="0.5"/>

  <!-- Head profile silhouette (left) -->
  <g opacity="0.18" fill="#ffffff">
    <path d="M 210 108 Q 168 100 136 124 Q 104 148 100 190 Q 96 224 112 250 L 100 274 Q 94 286 108 290 L 126 294 L 126 316 Q 126 332 144 334 L 186 336 L 190 300 Q 224 292 240 262 Q 256 232 250 194 Q 244 142 210 108 Z"/>
  </g>

  <!-- Brain outline inside head -->
  <g fill="none" stroke="#c8e47a" stroke-width="2.2" opacity="0.75">
    <path d="M 138 176 Q 132 152 154 142 Q 168 132 184 140 Q 200 128 216 142 Q 236 150 232 174 Q 242 190 230 206 Q 232 226 212 232 Q 196 244 178 234 Q 158 240 148 224 Q 132 214 138 196 Z"/>
    <path d="M 184 140 L 184 234" stroke-width="1.6" opacity="0.6"/>
    <path d="M 152 160 Q 168 168 160 184 Q 152 198 168 208" stroke-width="1.4" opacity="0.55"/>
    <path d="M 216 158 Q 200 168 210 184 Q 220 198 204 210" stroke-width="1.4" opacity="0.55"/>
  </g>

  <!-- Hippocampus highlight (memory region) -->
  <path d="M 162 212 Q 178 226 202 220" fill="none" stroke="#abce5f" stroke-width="5" stroke-linecap="round" opacity="0.95"/>
  <circle cx="182" cy="218" r="26" fill="none" stroke="#c8e47a" stroke-width="1.8" opacity="0.6"/>
  <circle cx="182" cy="218" r="38" fill="none" stroke="#c8e47a" stroke-width="1.2" opacity="0.3"/>

  <!-- Fading memory dots (drifting away) -->
  <g fill="#c8e47a">
    <circle cx="268" cy="150" r="4.5" opacity="0.7"/>
    <circle cx="292" cy="126" r="3.6" opacity="0.5"/>
    <circle cx="316" cy="108" r="2.8" opacity="0.35"/>
    <circle cx="338" cy="94" r="2.2" opacity="0.22"/>
    <circle cx="358" cy="84" r="1.6" opacity="0.14"/>
  </g>

  <!-- MRI monitor screen at right (axial brain slice) -->
  <g transform="translate(450 80)">
    <rect x="0" y="0" width="280" height="190" rx="12" fill="url(#screenPanel)" stroke="#abce5f" stroke-width="2" opacity="0.95"/>

    <!-- Axial slice: skull outline -->
    <ellipse cx="140" cy="100" rx="86" ry="66" fill="#0a1d2e" opacity="0.7" stroke="#ffffff" stroke-width="1.6"/>
    <ellipse cx="140" cy="100" rx="76" ry="57" fill="none" stroke="#abce5f" stroke-width="1.4" opacity="0.55"/>

    <!-- Interhemispheric fissure -->
    <path d="M 140 44 L 140 156" stroke="#ffffff" stroke-width="1.3" opacity="0.45"/>

    <!-- Enlarged ventricles (atrophy sign) -->
    <path d="M 128 82 Q 116 96 122 116 Q 130 126 136 112 Q 138 96 132 84 Z" fill="#e6f4ff" opacity="0.55"/>
    <path d="M 152 82 Q 164 96 158 116 Q 150 126 144 112 Q 142 96 148 84 Z" fill="#e6f4ff" opacity="0.55"/>

    <!-- Hippocampal regions marked -->
    <ellipse cx="106" cy="122" rx="14" ry="9" fill="url(#hippoGrad)" opacity="0.8"/>
    <ellipse cx="174" cy="122" rx="14" ry="9" fill="url(#hippoGrad)" opacity="0.8"/>
    <circle cx="106" cy="122" r="20" fill="none" stroke="#abce5f" stroke-width="1.5" opacity="0.7"/>
    <circle cx="174" cy="122" r="20" fill="none" stroke="#abce5f" stroke-width="1.5" opacity="0.7"/>

    <!-- Sulci (widened) -->
    <g stroke="#ffffff" stroke-width="1.1" opacity="0.35" fill="none">
      <path d="M 96 62 Q 108 74 100 86"/>
      <path d="M 184 62 Q 172 74 180 86"/>
      <path d="M 112 148 Q 122 138 116 130"/>
      <path d="M 168 148 Q 158 138 164 130"/>
    </g>

    <!-- Screen label -->
    <text x="140" y="184" font-family="Montserrat, Arial, sans-serif" font-size="10" font-weight="700"
          fill="#abce5f" text-anchor="middle" opacity="0.95">CRÂNIO • REGIÃO HIPOCAMPAL</text>
    <!-- Info bar -->
    <text x="14" y="22" font-family="Montserrat, Arial, sans-serif" font-size="9" font-weight="600"
          fill="#ffffff" opacity="0.7">RM / TC DE CRÂNIO</text>
  </g>

  <!-- Title -->
  <text x="430" y="320" font-family="Montserrat, Arial, sans-serif" font-size="26" font-weight="800"
        fill="#ffffff" text-anchor="middle">Perda de memória: quando investigar</text>

  <!-- Subtitle -->
  <text x="430" y="355" font-family="Open Sans, Arial, sans-serif" font-size="15" font-weight="400"
        fill="#c8e47a" text-anchor="middle">Dia Mundial do Alzheimer • 21 de setembro</text>

  <!-- Bottom accent line -->
  <rect x="300" y="370" width="260" height="3" rx="1.5" fill="url(#accent)" opacity="0.85"/>
</svg>
