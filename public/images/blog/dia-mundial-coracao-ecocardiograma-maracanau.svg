<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bgEC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#003f6b;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#005a87;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#007ab5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentEC" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#abce5f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c8e47a;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="screenEC" cx="50%" cy="50%" r="70%">
      <stop offset="0%" style="stop-color:#0a2540;stop-opacity:0.95" />
      <stop offset="60%" style="stop-color:#031426;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#000814;stop-opacity:1" />
    </radialGradient>
    <linearGradient id="heartEC" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#cfe7ff;stop-opacity:0.6" />
    </linearGradient>
    <radialGradient id="flowEC" cx="50%" cy="50%" r="65%">
      <stop offset="0%" style="stop-color:#ff8a65;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#ff8a65;stop-opacity:0" />
    </radialGradient>
    <radialGradient id="flowBlueEC" cx="50%" cy="50%" r="65%">
      <stop offset="0%" style="stop-color:#4fc3f7;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#4fc3f7;stop-opacity:0" />
    </radialGradient>
  </defs>

  <rect width="800" height="400" fill="url(#bgEC)" />

  <circle cx="700" cy="60" r="120" fill="#007ab5" opacity="0.25"/>
  <circle cx="740" cy="320" r="80" fill="#abce5f" opacity="0.12"/>
  <circle cx="80" cy="350" r="100" fill="#005a87" opacity="0.3"/>
  <circle cx="50" cy="80" r="60" fill="#abce5f" opacity="0.1"/>

  <circle cx="600" cy="40" r="4" fill="#abce5f" opacity="0.5"/>
  <circle cx="625" cy="55" r="3" fill="#abce5f" opacity="0.4"/>
  <circle cx="615" cy="75" r="5" fill="#abce5f" opacity="0.3"/>
  <circle cx="650" cy="35" r="3" fill="#abce5f" opacity="0.5"/>

  <!-- Echo viewer: heart chambers with colour Doppler flow -->
  <g transform="translate(60 50)">
    <rect x="0" y="0" width="300" height="240" rx="10" fill="url(#screenEC)" stroke="#abce5f" stroke-width="2.5" opacity="0.95"/>

    <rect x="58" y="-6" width="22" height="12" rx="2" fill="#ffffff" opacity="0.7"/>
    <rect x="220" y="-6" width="22" height="12" rx="2" fill="#ffffff" opacity="0.7"/>

    <!-- Sector scan cone -->
    <path d="M 150 34 L 44 202 L 256 202 Z" fill="#0a2540" opacity="0.5"/>

    <!-- Heart silhouette inside the cone -->
    <path d="M 150 76 Q 126 52 104 70 Q 82 90 100 122 Q 118 152 150 178 Q 182 152 200 122 Q 218 90 196 70 Q 174 52 150 76 Z"
          fill="url(#heartEC)" opacity="0.72"/>

    <!-- Chamber divisions -->
    <path d="M 150 76 L 150 178" fill="none" stroke="#031426" stroke-width="3" opacity="0.6"/>
    <path d="M 108 112 Q 150 104 192 112" fill="none" stroke="#031426" stroke-width="2.5" opacity="0.45"/>

    <!-- Valve leaflets -->
    <path d="M 124 112 L 134 126" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" opacity="0.8"/>
    <path d="M 148 112 L 138 126" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" opacity="0.8"/>
    <path d="M 154 112 L 164 126" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" opacity="0.7"/>
    <path d="M 178 112 L 168 126" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" opacity="0.7"/>

    <!-- Doppler colour jets -->
    <ellipse cx="128" cy="146" rx="26" ry="20" fill="url(#flowEC)"/>
    <ellipse cx="176" cy="146" rx="24" ry="18" fill="url(#flowBlueEC)"/>

    <!-- ECG trace at the bottom of the screen -->
    <path d="M 26 224 L 62 224 L 70 210 L 78 236 L 86 218 L 96 224 L 148 224 L 156 210 L 164 236 L 172 218 L 182 224 L 240 224 L 248 212 L 256 234 L 264 220 L 274 224"
          fill="none" stroke="#abce5f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>

    <text x="14" y="20" font-family="Montserrat, Arial, sans-serif" font-size="10" font-weight="700"
          fill="#abce5f" opacity="0.95">ECOCARDIOGRAMA</text>
    <text x="286" y="20" font-family="Montserrat, Arial, sans-serif" font-size="10" font-weight="700"
          fill="#abce5f" opacity="0.95" text-anchor="end">DOPPLER COLORIDO</text>
  </g>

  <!-- Right side: heart icon, pulse ring and probe -->
  <g transform="translate(560 60)">
    <g opacity="0.92">
      <path d="M 70 40 Q 48 14 26 32 Q 4 52 22 84 Q 40 114 70 140 Q 100 114 118 84 Q 136 52 114 32 Q 92 14 70 40 Z"
            fill="#ff8a65" opacity="0.9"/>
      <path d="M 26 78 L 48 78 L 56 60 L 68 98 L 80 72 L 90 78 L 112 78"
            fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
    </g>

    <circle cx="70" cy="84" r="76" fill="none" stroke="#abce5f" stroke-width="2" opacity="0.25"/>
    <circle cx="70" cy="84" r="94" fill="none" stroke="#abce5f" stroke-width="1.6" opacity="0.14"/>

    <!-- Probe -->
    <g transform="translate(48 186)">
      <rect x="10" y="0" width="42" height="58" rx="12" fill="#ffffff" opacity="0.95"/>
      <rect x="18" y="12" width="26" height="28" rx="6" fill="#005a87" opacity="0.85"/>
      <rect x="10" y="58" width="42" height="11" rx="4" fill="#abce5f" opacity="0.9"/>
      <path d="M 31 0 Q 31 -18 54 -24" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
      <g stroke="#abce5f" fill="none" stroke-linecap="round" opacity="0.6">
        <path d="M 14 82 Q 31 94 48 82" stroke-width="3"/>
      </g>
      <circle cx="31" cy="76" r="3" fill="#c8e47a" opacity="0.85"/>
    </g>

    <circle cx="4" cy="150" r="2.5" fill="#abce5f" opacity="0.7"/>
    <circle cx="150" cy="132" r="2" fill="#c8e47a" opacity="0.6"/>
    <circle cx="16" cy="196" r="2" fill="#abce5f" opacity="0.55"/>
  </g>

  <text x="400" y="325" font-family="Montserrat, Arial, sans-serif" font-size="24" font-weight="800"
        fill="#ffffff" text-anchor="middle">Dia Mundial do Coracao</text>

  <text x="400" y="358" font-family="Open Sans, Arial, sans-serif" font-size="14" font-weight="400"
        fill="#c8e47a" text-anchor="middle">O que o ecocardiograma mostra sobre o seu coracao</text>

  <rect x="260" y="372" width="280" height="3" rx="1.5" fill="url(#accentEC)" opacity="0.85"/>
</svg>
