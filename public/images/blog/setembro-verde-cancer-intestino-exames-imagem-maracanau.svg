<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bgSV" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#003f6b;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#005a87;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#007ab5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentSV" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#abce5f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c8e47a;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="screenSV" cx="50%" cy="50%" r="70%">
      <stop offset="0%" style="stop-color:#0a2540;stop-opacity:0.95" />
      <stop offset="60%" style="stop-color:#031426;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#000814;stop-opacity:1" />
    </radialGradient>
    <linearGradient id="colonSV" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#d8ecff;stop-opacity:0.9" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="url(#bgSV)" />

  <!-- Decorative circles -->
  <circle cx="700" cy="60" r="120" fill="#007ab5" opacity="0.25"/>
  <circle cx="740" cy="320" r="80" fill="#abce5f" opacity="0.12"/>
  <circle cx="80" cy="350" r="100" fill="#005a87" opacity="0.3"/>
  <circle cx="50" cy="80" r="60" fill="#abce5f" opacity="0.1"/>

  <!-- Decorative dots -->
  <circle cx="600" cy="40" r="4" fill="#abce5f" opacity="0.5"/>
  <circle cx="625" cy="55" r="3" fill="#abce5f" opacity="0.4"/>
  <circle cx="615" cy="75" r="5" fill="#abce5f" opacity="0.3"/>
  <circle cx="650" cy="35" r="3" fill="#abce5f" opacity="0.5"/>

  <!-- CT abdomen viewer (left) -->
  <g transform="translate(60 50)">
    <rect x="0" y="0" width="280" height="240" rx="10" fill="url(#screenSV)" stroke="#abce5f" stroke-width="2.5" opacity="0.95"/>

    <!-- Axial CT slice: body outline -->
    <ellipse cx="140" cy="120" rx="108" ry="80" fill="#12304f" stroke="#cfe7ff" stroke-width="1.8" opacity="0.85"/>
    <ellipse cx="140" cy="120" rx="96" ry="69" fill="#0d2743" stroke="#9ec6ec" stroke-width="1" opacity="0.7"/>

    <!-- Spine -->
    <circle cx="140" cy="176" r="15" fill="#1b3a5c" stroke="#cfe7ff" stroke-width="1.6" opacity="0.85"/>
    <rect x="133" y="186" width="14" height="10" rx="3" fill="#1b3a5c" stroke="#cfe7ff" stroke-width="1.2" opacity="0.7"/>

    <!-- Liver silhouette -->
    <path d="M 60 82 Q 108 68 128 90 Q 122 122 88 130 Q 60 124 60 82 Z"
          fill="#1b3a5c" stroke="#cfe7ff" stroke-width="1.3" opacity="0.7"/>

    <!-- Bowel loops -->
    <g stroke="#9ec6ec" stroke-width="1.4" fill="none" opacity="0.6">
      <circle cx="168" cy="98" r="13"/>
      <circle cx="196" cy="118" r="11"/>
      <circle cx="164" cy="136" r="12"/>
      <circle cx="118" cy="146" r="10"/>
      <circle cx="92" cy="160" r="9"/>
    </g>

    <!-- Suspicious lesion (highlighted) -->
    <circle cx="196" cy="118" r="11" fill="#abce5f" opacity="0.45"/>
    <circle cx="196" cy="118" r="6" fill="#c8e47a" opacity="0.8"/>

    <!-- Crosshair on lesion -->
    <g stroke="#c8e47a" stroke-width="1.2" opacity="0.8">
      <line x1="196" y1="98" x2="196" y2="106"/>
      <line x1="196" y1="130" x2="196" y2="138"/>
      <line x1="176" y1="118" x2="184" y2="118"/>
      <line x1="208" y1="118" x2="216" y2="118"/>
    </g>

    <!-- Labels -->
    <text x="14" y="20" font-family="Montserrat, Arial, sans-serif" font-size="10" font-weight="700"
          fill="#abce5f" opacity="0.95">TC</text>
    <text x="266" y="20" font-family="Montserrat, Arial, sans-serif" font-size="10" font-weight="700"
          fill="#abce5f" opacity="0.95" text-anchor="end">AXIAL</text>
    <text x="140" y="232" font-family="Montserrat, Arial, sans-serif" font-size="9" font-weight="700"
          fill="#abce5f" text-anchor="middle" opacity="0.95">ABDOME E PELVE • UNO DIAGNÓSTICO</text>
  </g>

  <!-- Colon icon + green ribbon (right side) -->
  <g transform="translate(545 92)">
    <ellipse cx="60" cy="62" rx="80" ry="64" fill="#abce5f" opacity="0.16" stroke="#abce5f" stroke-width="2.5"/>

    <!-- Colon frame shape -->
    <path d="M 24 104 L 24 46 Q 24 28 42 28 L 78 28 Q 96 28 96 46 L 96 96 Q 96 110 82 110 L 74 110"
          fill="none" stroke="url(#colonSV)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Rectum / sigmoid tail -->
    <path d="M 74 110 Q 60 110 60 96"
          fill="none" stroke="url(#colonSV)" stroke-width="13" stroke-linecap="round"/>
    <!-- Haustra marks -->
    <g stroke="#7fb0dd" stroke-width="2" opacity="0.55" stroke-linecap="round">
      <line x1="17" y1="60" x2="31" y2="60"/>
      <line x1="17" y1="80" x2="31" y2="80"/>
      <line x1="50" y1="21" x2="50" y2="35"/>
      <line x1="70" y1="21" x2="70" y2="35"/>
      <line x1="89" y1="62" x2="103" y2="62"/>
      <line x1="89" y1="82" x2="103" y2="82"/>
    </g>
    <!-- Polyp marker -->
    <circle cx="96" cy="46" r="7" fill="#abce5f" opacity="0.9" stroke="#ffffff" stroke-width="1.6"/>

    <!-- Sparkles -->
    <circle cx="6" cy="16" r="2.5" fill="#abce5f" opacity="0.75"/>
    <circle cx="114" cy="18" r="2" fill="#c8e47a" opacity="0.65"/>
    <circle cx="10" cy="112" r="2" fill="#abce5f" opacity="0.55"/>
    <circle cx="114" cy="110" r="2.5" fill="#c8e47a" opacity="0.7"/>
  </g>

  <!-- Awareness ribbon (green) -->
  <g transform="translate(392 96)">
    <path d="M 24 0 Q 6 30 2 58 Q 0 74 10 78 Q 20 80 24 66 Q 28 80 38 78 Q 48 74 46 58 Q 42 30 24 0 Z"
          fill="none" stroke="#abce5f" stroke-width="7" stroke-linejoin="round" opacity="0.9"/>
    <path d="M 24 46 Q 12 62 8 74" fill="none" stroke="#c8e47a" stroke-width="7" stroke-linecap="round" opacity="0.9"/>
    <path d="M 24 46 Q 36 62 40 74" fill="none" stroke="#c8e47a" stroke-width="7" stroke-linecap="round" opacity="0.9"/>
  </g>

  <!-- Decorative wave -->
  <g opacity="0.4" fill="none" stroke="#abce5f" stroke-width="2.5" stroke-linecap="round">
    <path d="M 480 236 Q 540 254 590 268 Q 640 280 700 252"/>
    <circle cx="700" cy="252" r="6" fill="#abce5f" stroke="none" opacity="0.85"/>
  </g>

  <!-- Title -->
  <text x="400" y="325" font-family="Montserrat, Arial, sans-serif" font-size="24" font-weight="800"
        fill="#ffffff" text-anchor="middle">Setembro Verde</text>

  <!-- Subtitle -->
  <text x="400" y="358" font-family="Open Sans, Arial, sans-serif" font-size="14" font-weight="400"
        fill="#c8e47a" text-anchor="middle">Câncer de intestino e o papel dos exames de imagem</text>

  <!-- Accent line -->
  <rect x="280" y="372" width="240" height="3" rx="1.5" fill="url(#accentSV)" opacity="0.85"/>
</svg>
