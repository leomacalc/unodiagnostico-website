<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#003f6b;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#005a87;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#007ab5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#abce5f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c8e47a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="screenPanel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.18" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.05" />
    </linearGradient>
    <radialGradient id="noduleGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffd166;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#ff9a3c;stop-opacity:0.9" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="url(#bg)" />

  <!-- Decorative circles -->
  <circle cx="700" cy="60" r="120" fill="#007ab5" opacity="0.25"/>
  <circle cx="740" cy="320" r="80" fill="#abce5f" opacity="0.12"/>
  <circle cx="80" cy="350" r="100" fill="#005a87" opacity="0.3"/>
  <circle cx="50" cy="80" r="60" fill="#abce5f" opacity="0.1"/>

  <!-- Decorative dots -->
  <circle cx="600" cy="40" r="4" fill="#abce5f" opacity="0.5"/>
  <circle cx="625" cy="55" r="3" fill="#abce5f" opacity="0.4"/>
  <circle cx="615" cy="75" r="5" fill="#abce5f" opacity="0.3"/>
  <circle cx="650" cy="35" r="3" fill="#abce5f" opacity="0.5"/>

  <!-- Ultrasound probe (transducer) on the left -->
  <g transform="translate(150 70)">
    <rect x="0" y="0" width="46" height="60" rx="9" fill="#ffffff" opacity="0.95"/>
    <rect x="5" y="5" width="36" height="40" rx="5" fill="#005a87" opacity="0.85"/>
    <rect x="2" y="48" width="42" height="10" rx="3" fill="#abce5f" opacity="0.95"/>
    <path d="M 23 0 Q 52 -22 98 -8" fill="none" stroke="#ffffff" stroke-width="3.5" opacity="0.85"/>
    <circle cx="14" cy="26" r="2.5" fill="#ffffff" opacity="0.7"/>
    <circle cx="32" cy="26" r="2.5" fill="#ffffff" opacity="0.7"/>
  </g>

  <!-- Sound waves emitting from probe toward the nodule -->
  <g opacity="0.5">
    <path d="M 150 140 Q 185 130 220 142" fill="none" stroke="#abce5f" stroke-width="2"/>
    <path d="M 146 152 Q 185 140 228 154" fill="none" stroke="#abce5f" stroke-width="2"/>
    <path d="M 142 164 Q 185 150 235 166" fill="none" stroke="#abce5f" stroke-width="2"/>
  </g>

  <!-- Target nodule in tissue -->
  <g transform="translate(225 215)">
    <ellipse cx="0" cy="0" rx="120" ry="70" fill="#ffffff" opacity="0.08"/>
    <circle cx="0" cy="0" r="26" fill="url(#noduleGrad)" stroke="#ffffff" stroke-width="2" opacity="0.95"/>
    <circle cx="-7" cy="-8" r="6" fill="#ffffff" opacity="0.5"/>
    <!-- Crosshair on nodule -->
    <g stroke="#ffffff" stroke-width="1.4" opacity="0.8">
      <line x1="-38" y1="0" x2="-30" y2="0"/>
      <line x1="30" y1="0" x2="38" y2="0"/>
      <line x1="0" y1="-38" x2="0" y2="-30"/>
      <line x1="0" y1="30" x2="0" y2="38"/>
    </g>
  </g>

  <!-- Biopsy needle entering toward the nodule -->
  <g>
    <line x1="60" y1="300" x2="222" y2="212" stroke="#e6f4ff" stroke-width="5" stroke-linecap="round" opacity="0.95"/>
    <line x1="60" y1="300" x2="222" y2="212" stroke="#005a87" stroke-width="1.6" stroke-linecap="round" opacity="0.7"/>
    <!-- Needle hub -->
    <rect x="38" y="300" width="34" height="16" rx="4" transform="rotate(-28 55 308)" fill="#abce5f" opacity="0.95"/>
  </g>

  <!-- Ultrasound monitor screen at right showing needle reaching nodule -->
  <g transform="translate(470 70)">
    <rect x="0" y="0" width="270" height="180" rx="12" fill="url(#screenPanel)" stroke="#abce5f" stroke-width="2" opacity="0.95"/>
    <path d="M 135 14 L 28 162 L 242 162 Z" fill="#0a1d2e" opacity="0.6"/>
    <!-- Echo speckles -->
    <g fill="#ffffff" opacity="0.35">
      <circle cx="80" cy="80" r="1.2"/>
      <circle cx="100" cy="110" r="1"/>
      <circle cx="120" cy="60" r="1.4"/>
      <circle cx="150" cy="95" r="1.2"/>
      <circle cx="165" cy="130" r="1"/>
      <circle cx="185" cy="75" r="1.3"/>
      <circle cx="95" cy="140" r="1.2"/>
      <circle cx="200" cy="120" r="1.1"/>
      <circle cx="60" cy="120" r="1"/>
    </g>
    <!-- Hypoechoic target nodule on screen -->
    <ellipse cx="150" cy="110" rx="24" ry="20" fill="#0a1d2e" stroke="#ffd166" stroke-width="1.8" opacity="0.95" stroke-dasharray="4,3"/>
    <!-- Needle line on screen reaching the nodule -->
    <line x1="40" y1="150" x2="150" y2="110" stroke="#abce5f" stroke-width="2.4" opacity="0.95"/>
    <circle cx="150" cy="110" r="3" fill="#abce5f" opacity="0.95"/>
    <text x="135" y="174" font-family="Montserrat, Arial, sans-serif" font-size="10" font-weight="700"
          fill="#abce5f" text-anchor="middle" opacity="0.95">PUNCAO GUIADA • TEMPO REAL</text>
    <text x="14" y="28" font-family="Montserrat, Arial, sans-serif" font-size="9" font-weight="600"
          fill="#ffffff" opacity="0.7">CORE / PAAF</text>
  </g>

  <!-- Title -->
  <text x="400" y="322" font-family="Montserrat, Arial, sans-serif" font-size="25" font-weight="800"
        fill="#ffffff" text-anchor="middle">Biopsias e puncoes guiadas por imagem</text>

  <!-- Subtitle -->
  <text x="400" y="355" font-family="Open Sans, Arial, sans-serif" font-size="15" font-weight="400"
        fill="#c8e47a" text-anchor="middle">Diagnostico preciso • Minimamente invasivo • Sem cirurgia</text>

  <!-- Bottom accent line -->
  <rect x="280" y="370" width="240" height="3" rx="1.5" fill="url(#accent)" opacity="0.85"/>
</svg>
