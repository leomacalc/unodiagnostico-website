<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#003f6b;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#005a87;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#007ab5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#abce5f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c8e47a;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="nerveGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" style="stop-color:#e6f4ff;stop-opacity:0.95" />
      <stop offset="60%" style="stop-color:#abce5f;stop-opacity:0.85" />
      <stop offset="100%" style="stop-color:#7ba640;stop-opacity:0.9" />
    </radialGradient>
    <linearGradient id="screenPanel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.18" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.05" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="url(#bg)" />

  <!-- Decorative circles -->
  <circle cx="700" cy="60" r="120" fill="#007ab5" opacity="0.25"/>
  <circle cx="740" cy="320" r="80" fill="#abce5f" opacity="0.12"/>
  <circle cx="80" cy="350" r="100" fill="#005a87" opacity="0.3"/>
  <circle cx="50" cy="80" r="60" fill="#abce5f" opacity="0.1"/>

  <!-- Decorative dots -->
  <circle cx="600" cy="40" r="4" fill="#abce5f" opacity="0.5"/>
  <circle cx="625" cy="55" r="3" fill="#abce5f" opacity="0.4"/>
  <circle cx="615" cy="75" r="5" fill="#abce5f" opacity="0.3"/>
  <circle cx="650" cy="35" r="3" fill="#abce5f" opacity="0.5"/>

  <!-- Hand and forearm silhouette -->
  <g opacity="0.18">
    <path d="M 108 262 L 108 196 Q 108 182 122 182 Q 136 182 136 196 L 136 150 Q 136 134 151 134 Q 166 134 166 150 L 166 146 Q 166 129 181 129 Q 196 129 196 146 L 196 156 Q 196 140 211 140 Q 225 140 225 157 L 225 216 Q 225 262 196 282 L 196 316 L 108 316 Z"
          fill="#ffffff"/>
    <rect x="108" y="300" width="88" height="76" rx="14" fill="#ffffff"/>
  </g>

  <!-- Median nerve path running through wrist into fingers -->
  <g opacity="0.85">
    <path d="M 152 372 Q 150 330 154 300 Q 158 274 170 250 Q 178 232 186 200"
          fill="none" stroke="url(#accent)" stroke-width="7" stroke-linecap="round" opacity="0.9"/>
    <path d="M 168 254 Q 150 226 140 190" fill="none" stroke="#abce5f" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
    <path d="M 172 250 Q 168 214 166 178" fill="none" stroke="#abce5f" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
    <path d="M 176 248 Q 186 216 200 186" fill="none" stroke="#abce5f" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- Compression point highlight (carpal tunnel) -->
  <circle cx="158" cy="288" r="26" fill="none" stroke="#c8e47a" stroke-width="2.5" opacity="0.85"/>
  <circle cx="158" cy="288" r="38" fill="none" stroke="#c8e47a" stroke-width="1.5" opacity="0.45"/>
  <circle cx="158" cy="288" r="9" fill="url(#nerveGrad)" opacity="0.95"/>

  <!-- Sound waves emitting from probe -->
  <g opacity="0.55">
    <path d="M 128 234 Q 158 222 188 234" fill="none" stroke="#abce5f" stroke-width="2"/>
    <path d="M 121 244 Q 158 230 195 244" fill="none" stroke="#abce5f" stroke-width="2"/>
    <path d="M 115 254 Q 158 238 201 254" fill="none" stroke="#abce5f" stroke-width="2"/>
  </g>

  <!-- Ultrasound linear probe -->
  <g transform="translate(133 172)">
    <rect x="0" y="0" width="50" height="56" rx="9" fill="#ffffff" opacity="0.95"/>
    <rect x="6" y="5" width="38" height="36" rx="5" fill="#005a87" opacity="0.85"/>
    <rect x="2" y="45" width="46" height="9" rx="3" fill="#abce5f" opacity="0.95"/>
    <path d="M 25 0 Q 54 -24 100 -10" fill="none" stroke="#ffffff" stroke-width="3.5" opacity="0.85"/>
    <circle cx="15" cy="24" r="2.5" fill="#ffffff" opacity="0.7"/>
    <circle cx="35" cy="24" r="2.5" fill="#ffffff" opacity="0.7"/>
  </g>

  <!-- Ultrasound monitor screen at right -->
  <g transform="translate(450 80)">
    <rect x="0" y="0" width="280" height="190" rx="12" fill="url(#screenPanel)" stroke="#abce5f" stroke-width="2" opacity="0.95"/>
    <path d="M 140 15 L 30 170 L 250 170 Z" fill="#0a1d2e" opacity="0.6"/>

    <!-- Echo speckles -->
    <g fill="#ffffff" opacity="0.35">
      <circle cx="80" cy="85" r="1.2"/>
      <circle cx="103" cy="112" r="1"/>
      <circle cx="122" cy="62" r="1.4"/>
      <circle cx="146" cy="98" r="1.2"/>
      <circle cx="163" cy="132" r="1"/>
      <circle cx="182" cy="78" r="1.3"/>
      <circle cx="202" cy="118" r="1"/>
      <circle cx="92" cy="142" r="1.2"/>
      <circle cx="172" cy="155" r="1.1"/>
      <circle cx="220" cy="142" r="1.2"/>
      <circle cx="62" cy="124" r="1"/>
      <circle cx="196" cy="58" r="1.2"/>
      <circle cx="127" cy="155" r="1.1"/>
    </g>

    <!-- Carpal tunnel cross-section on screen -->
    <path d="M 78 96 Q 140 74 202 96 Q 210 130 140 142 Q 70 130 78 96 Z"
          fill="#123047" stroke="#abce5f" stroke-width="1.6" opacity="0.92"/>
    <!-- Transverse carpal ligament (arch) -->
    <path d="M 80 96 Q 140 70 200 96" fill="none" stroke="#c8e47a" stroke-width="2.4" opacity="0.9"/>
    <!-- Flexor tendons -->
    <circle cx="110" cy="120" r="7" fill="#1c4a6b" stroke="#ffffff" stroke-width="1.1" opacity="0.75"/>
    <circle cx="132" cy="126" r="6" fill="#1c4a6b" stroke="#ffffff" stroke-width="1.1" opacity="0.75"/>
    <circle cx="155" cy="124" r="7" fill="#1c4a6b" stroke="#ffffff" stroke-width="1.1" opacity="0.75"/>
    <circle cx="177" cy="118" r="6" fill="#1c4a6b" stroke="#ffffff" stroke-width="1.1" opacity="0.75"/>
    <!-- Median nerve (enlarged, highlighted) -->
    <ellipse cx="122" cy="100" rx="16" ry="11" fill="url(#nerveGrad)" stroke="#ffffff" stroke-width="1.8" opacity="0.95"/>
    <!-- Measurement calipers -->
    <path d="M 106 88 L 100 82 M 138 88 L 144 82" stroke="#ffffff" stroke-width="1.6" opacity="0.85"/>
    <text x="196" y="88" font-family="Montserrat, Arial, sans-serif" font-size="10" font-weight="700"
          fill="#c8e47a" text-anchor="middle" opacity="0.95">área &gt; 10 mm²</text>

    <!-- Screen label -->
    <text x="140" y="184" font-family="Montserrat, Arial, sans-serif" font-size="10" font-weight="700"
          fill="#abce5f" text-anchor="middle" opacity="0.95">PUNHO • CORTE TRANSVERSAL</text>
    <!-- Info bar -->
    <text x="14" y="28" font-family="Montserrat, Arial, sans-serif" font-size="9" font-weight="600"
          fill="#ffffff" opacity="0.7">LINEAR 12 MHz</text>
  </g>

  <!-- Title -->
  <text x="430" y="320" font-family="Montserrat, Arial, sans-serif" font-size="26" font-weight="800"
        fill="#ffffff" text-anchor="middle">Ultrassom de punho</text>

  <!-- Subtitle -->
  <text x="430" y="355" font-family="Open Sans, Arial, sans-serif" font-size="15" font-weight="400"
        fill="#c8e47a" text-anchor="middle">Síndrome do túnel do carpo • Nervo mediano</text>

  <!-- Bottom accent line -->
  <rect x="310" y="370" width="240" height="3" rx="1.5" fill="url(#accent)" opacity="0.85"/>
</svg>
