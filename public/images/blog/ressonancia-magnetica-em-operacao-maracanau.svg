<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#003f6b;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#005a87;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#007ab5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#abce5f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c8e47a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gantry" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.26" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.08" />
    </linearGradient>
    <radialGradient id="bore" cx="50%" cy="50%" r="60%">
      <stop offset="0%" style="stop-color:#0a1d2e;stop-opacity:0.95" />
      <stop offset="70%" style="stop-color:#04121e;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.9" />
    </radialGradient>
  </defs>

  <rect width="800" height="400" fill="url(#bg)" />

  <circle cx="700" cy="60" r="120" fill="#007ab5" opacity="0.25"/>
  <circle cx="740" cy="320" r="80" fill="#abce5f" opacity="0.12"/>
  <circle cx="80" cy="350" r="100" fill="#005a87" opacity="0.3"/>
  <circle cx="60" cy="70" r="60" fill="#abce5f" opacity="0.1"/>

  <circle cx="600" cy="40" r="4" fill="#abce5f" opacity="0.5"/>
  <circle cx="625" cy="55" r="3" fill="#abce5f" opacity="0.4"/>
  <circle cx="615" cy="75" r="5" fill="#abce5f" opacity="0.3"/>
  <circle cx="650" cy="35" r="3" fill="#abce5f" opacity="0.5"/>

  <!-- Ondas de radiofrequencia (esquerda) -->
  <g fill="none" stroke="#c8e47a" stroke-linecap="round">
    <path d="M 92 150 Q 62 190 92 230" stroke-width="2.4" opacity="0.5"/>
    <path d="M 118 136 Q 78 190 118 244" stroke-width="2.2" opacity="0.35"/>
    <path d="M 144 122 Q 94 190 144 258" stroke-width="2" opacity="0.22"/>
  </g>

  <!-- Equipamento de ressonancia (gantry + mesa) -->
  <g transform="translate(196 86)">
    <!-- corpo do gantry -->
    <rect x="0" y="0" width="250" height="186" rx="26" fill="url(#gantry)" stroke="#abce5f" stroke-width="2.2"/>
    <!-- bore -->
    <circle cx="125" cy="93" r="66" fill="url(#bore)" stroke="#ffffff" stroke-width="2" opacity="0.95"/>
    <circle cx="125" cy="93" r="52" fill="none" stroke="#abce5f" stroke-width="2.4" opacity="0.85"/>
    <circle cx="125" cy="93" r="38" fill="none" stroke="#c8e47a" stroke-width="1.4" opacity="0.45"/>
    <circle cx="125" cy="93" r="24" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.28"/>
    <!-- luz de status -->
    <circle cx="34" cy="30" r="5" fill="#abce5f" opacity="0.9"/>
    <circle cx="50" cy="30" r="5" fill="#ffffff" opacity="0.35"/>
    <!-- mesa do paciente -->
    <rect x="88" y="150" width="220" height="15" rx="7" fill="#ffffff" opacity="0.5"/>
    <rect x="150" y="165" width="14" height="34" rx="4" fill="#ffffff" opacity="0.22"/>
    <rect x="266" y="165" width="14" height="34" rx="4" fill="#ffffff" opacity="0.22"/>
  </g>

  <!-- Selo: sem radiacao -->
  <g transform="translate(556 108)">
    <rect x="0" y="0" width="180" height="52" rx="26" fill="#ffffff" opacity="0.12"/>
    <circle cx="30" cy="26" r="15" fill="none" stroke="#abce5f" stroke-width="2.4"/>
    <path d="M 21 35 L 39 17" stroke="#abce5f" stroke-width="2.4" stroke-linecap="round"/>
    <text x="56" y="23" font-family="Montserrat, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">SEM RADIACAO</text>
    <text x="56" y="39" font-family="Open Sans, Arial, sans-serif" font-size="11" fill="#c8e47a">campo magnetico</text>
  </g>

  <!-- Selo: alta definicao -->
  <g transform="translate(556 176)">
    <rect x="0" y="0" width="180" height="52" rx="26" fill="#ffffff" opacity="0.12"/>
    <circle cx="30" cy="26" r="15" fill="none" stroke="#abce5f" stroke-width="2.4"/>
    <circle cx="30" cy="26" r="6" fill="#abce5f" opacity="0.85"/>
    <text x="56" y="23" font-family="Montserrat, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">ALTA DEFINICAO</text>
    <text x="56" y="39" font-family="Open Sans, Arial, sans-serif" font-size="11" fill="#c8e47a">cranio, coluna, joelho</text>
  </g>

  <text x="400" y="322" font-family="Montserrat, Arial, sans-serif" font-size="27" font-weight="800"
        fill="#ffffff" text-anchor="middle">Ressonância magnética em Maracanaú</text>

  <text x="400" y="356" font-family="Open Sans, Arial, sans-serif" font-size="15" font-weight="400"
        fill="#c8e47a" text-anchor="middle">Já em operação na Uno Diagnóstico</text>

  <rect x="270" y="372" width="260" height="3" rx="1.5" fill="url(#accent)" opacity="0.85"/>
</svg>
