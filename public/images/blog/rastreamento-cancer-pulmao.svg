<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#003f6b;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#005a87;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#007ab5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#abce5f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c8e47a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="lungShape" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#c8e47a;stop-opacity:0.75" />
    </linearGradient>
    <radialGradient id="scanGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" style="stop-color:#abce5f;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#abce5f;stop-opacity:0" />
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#e8efd5;stop-opacity:0.95" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="url(#bg)" />

  <!-- Decorative circles -->
  <circle cx="700" cy="60" r="120" fill="#007ab5" opacity="0.25"/>
  <circle cx="740" cy="320" r="80" fill="#abce5f" opacity="0.12"/>
  <circle cx="80" cy="350" r="100" fill="#005a87" opacity="0.3"/>
  <circle cx="50" cy="80" r="60" fill="#abce5f" opacity="0.1"/>

  <!-- Decorative dots -->
  <circle cx="600" cy="40" r="4" fill="#abce5f" opacity="0.5"/>
  <circle cx="625" cy="55" r="3" fill="#abce5f" opacity="0.4"/>
  <circle cx="615" cy="75" r="5" fill="#abce5f" opacity="0.3"/>
  <circle cx="650" cy="35" r="3" fill="#abce5f" opacity="0.5"/>

  <!-- CT Scanner ring (donut/gantry) -->
  <g transform="translate(220 195)">
    <!-- Glow behind scanner -->
    <circle cx="0" cy="0" r="150" fill="url(#scanGlow)"/>

    <!-- Outer ring -->
    <circle cx="0" cy="0" r="110" fill="none" stroke="url(#ringGrad)" stroke-width="22" opacity="0.95"/>

    <!-- Inner accent ring -->
    <circle cx="0" cy="0" r="92" fill="none" stroke="#abce5f" stroke-width="2" opacity="0.6"/>
    <circle cx="0" cy="0" r="126" fill="none" stroke="#abce5f" stroke-width="2" opacity="0.5"/>

    <!-- Patient table going through -->
    <rect x="-150" y="-12" width="300" height="24" rx="6" fill="#e8efd5" opacity="0.85"/>
    <rect x="-150" y="6" width="300" height="6" rx="3" fill="#abce5f" opacity="0.8"/>

    <!-- Lungs inside gantry -->
    <g transform="translate(-58 -40)">
      <!-- Right lung (anatomical right) -->
      <path d="M 0 30 Q -18 10 -10 -10 Q 0 -30 22 -28 Q 38 -22 42 0 Q 46 25 38 50 Q 26 68 10 60 Q -4 52 0 30 Z"
            fill="url(#lungShape)" stroke="#ffffff" stroke-width="1.5" opacity="0.92"/>
      <!-- Bronchial detail -->
      <path d="M 22 -20 Q 24 0 28 18 Q 30 32 28 48" stroke="#005a87" stroke-width="1.2" fill="none" opacity="0.6"/>
    </g>
    <g transform="translate(58 -40)">
      <!-- Left lung -->
      <path d="M 0 30 Q 18 10 10 -10 Q 0 -30 -22 -28 Q -38 -22 -42 0 Q -46 25 -38 50 Q -26 68 -10 60 Q 4 52 0 30 Z"
            fill="url(#lungShape)" stroke="#ffffff" stroke-width="1.5" opacity="0.92"/>
      <!-- Bronchial detail -->
      <path d="M -22 -20 Q -24 0 -28 18 Q -30 32 -28 48" stroke="#005a87" stroke-width="1.2" fill="none" opacity="0.6"/>
    </g>

    <!-- Trachea connecting lungs -->
    <rect x="-4" y="-58" width="8" height="22" rx="3" fill="#e8efd5" opacity="0.9"/>

    <!-- Small nodule highlighted -->
    <circle cx="32" cy="0" r="6" fill="#ff7a45" opacity="0.9"/>
    <circle cx="32" cy="0" r="11" fill="none" stroke="#ff7a45" stroke-width="1.5" opacity="0.7"/>
    <circle cx="32" cy="0" r="16" fill="none" stroke="#ff7a45" stroke-width="1" opacity="0.45"/>

    <!-- Scan line -->
    <line x1="-120" y1="0" x2="120" y2="0" stroke="#abce5f" stroke-width="1.5" opacity="0.7" stroke-dasharray="6 4"/>
  </g>

  <!-- Low-dose label tag (top-right of scanner) -->
  <g transform="translate(370 110)">
    <rect x="0" y="0" width="120" height="34" rx="17" fill="#abce5f" opacity="0.92"/>
    <text x="60" y="22" font-family="Montserrat, Arial, sans-serif" font-size="13" font-weight="800"
          fill="#003f6b" text-anchor="middle">BAIXA DOSE</text>
  </g>

  <!-- "No smoking" symbol (top-right area) -->
  <g transform="translate(540 90)">
    <circle cx="40" cy="40" r="40" fill="none" stroke="#ff5252" stroke-width="5" opacity="0.92"/>
    <!-- Cigarette -->
    <rect x="14" y="34" width="48" height="12" rx="2" fill="#ffffff" opacity="0.95"/>
    <rect x="50" y="34" width="12" height="12" rx="2" fill="#ffb800" opacity="0.95"/>
    <!-- Cigarette tip glow -->
    <circle cx="14" cy="40" r="3" fill="#ff7a45" opacity="0.95"/>
    <!-- Smoke wisps -->
    <path d="M 14 32 Q 10 24 16 18 Q 20 12 14 6" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.6" stroke-linecap="round"/>
    <path d="M 22 30 Q 26 22 22 14" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.5" stroke-linecap="round"/>
    <!-- Slash line (no smoking) -->
    <line x1="11" y1="68" x2="68" y2="11" stroke="#ff5252" stroke-width="5" stroke-linecap="round" opacity="0.92"/>
  </g>

  <!-- Decorative arc/wave -->
  <g opacity="0.4" fill="none" stroke="#abce5f" stroke-width="2.5" stroke-linecap="round">
    <path d="M 480 235 Q 540 250 600 240 Q 660 230 720 250"/>
    <circle cx="720" cy="250" r="6" fill="#abce5f" stroke="none" opacity="0.85"/>
  </g>

  <!-- Title -->
  <text x="400" y="325" font-family="Montserrat, Arial, sans-serif" font-size="24" font-weight="800"
        fill="#ffffff" text-anchor="middle">Rastreamento de câncer de pulmão</text>

  <!-- Subtitle -->
  <text x="400" y="358" font-family="Open Sans, Arial, sans-serif" font-size="15" font-weight="400"
        fill="#c8e47a" text-anchor="middle">Tomografia de baixa dose • Diagnóstico precoce salva vidas</text>

  <!-- Bottom accent line -->
  <rect x="260" y="372" width="280" height="3" rx="1.5" fill="url(#accent)" opacity="0.85"/>
</svg>
