<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bgDG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#003f6b;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#005a87;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#007ab5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentDG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#abce5f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c8e47a;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="screenDG" cx="50%" cy="50%" r="70%">
      <stop offset="0%" style="stop-color:#0a2540;stop-opacity:0.95" />
      <stop offset="60%" style="stop-color:#031426;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#000814;stop-opacity:1" />
    </radialGradient>
    <linearGradient id="organDG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.85" />
      <stop offset="100%" style="stop-color:#cfe7ff;stop-opacity:0.6" />
    </linearGradient>
    <radialGradient id="fluidDG" cx="50%" cy="50%" r="65%">
      <stop offset="0%" style="stop-color:#4fc3f7;stop-opacity:0.55" />
      <stop offset="100%" style="stop-color:#4fc3f7;stop-opacity:0" />
    </radialGradient>
  </defs>

  <rect width="800" height="400" fill="url(#bgDG)" />

  <circle cx="700" cy="60" r="120" fill="#007ab5" opacity="0.25"/>
  <circle cx="740" cy="320" r="80" fill="#abce5f" opacity="0.12"/>
  <circle cx="80" cy="350" r="100" fill="#005a87" opacity="0.3"/>
  <circle cx="50" cy="80" r="60" fill="#abce5f" opacity="0.1"/>

  <circle cx="600" cy="40" r="4" fill="#abce5f" opacity="0.5"/>
  <circle cx="625" cy="55" r="3" fill="#abce5f" opacity="0.4"/>
  <circle cx="615" cy="75" r="5" fill="#abce5f" opacity="0.3"/>
  <circle cx="650" cy="35" r="3" fill="#abce5f" opacity="0.5"/>

  <!-- Ultrasound viewer showing abdomen: gallbladder wall thickening + free fluid -->
  <g transform="translate(60 50)">
    <rect x="0" y="0" width="300" height="240" rx="10" fill="url(#screenDG)" stroke="#abce5f" stroke-width="2.5" opacity="0.95"/>

    <rect x="58" y="-6" width="22" height="12" rx="2" fill="#ffffff" opacity="0.7"/>
    <rect x="220" y="-6" width="22" height="12" rx="2" fill="#ffffff" opacity="0.7"/>

    <!-- Liver silhouette -->
    <path d="M 34 62 Q 120 44 196 66 Q 200 118 160 142 Q 96 160 46 132 Q 30 100 34 62 Z"
          fill="url(#organDG)" opacity="0.75"/>
    <path d="M 60 78 Q 110 70 160 84" fill="none" stroke="#ffffff" stroke-width="1.6" opacity="0.35"/>
    <path d="M 58 100 Q 112 94 158 108" fill="none" stroke="#ffffff" stroke-width="1.6" opacity="0.25"/>

    <!-- Gallbladder with thickened wall -->
    <ellipse cx="112" cy="132" rx="34" ry="19" fill="#4fc3f7" opacity="0.18" transform="rotate(-12 112 132)"/>
    <ellipse cx="112" cy="132" rx="26" ry="12" fill="#031426" opacity="0.9" transform="rotate(-12 112 132)"/>
    <ellipse cx="112" cy="132" rx="26" ry="12" fill="none" stroke="#ff8a65" stroke-width="4" opacity="0.85" transform="rotate(-12 112 132)"/>

    <!-- Free fluid pockets (ascite) -->
    <ellipse cx="216" cy="168" rx="52" ry="30" fill="url(#fluidDG)"/>
    <path d="M 176 172 Q 214 150 254 176 Q 236 198 202 194 Q 184 188 176 172 Z" fill="#031426" opacity="0.85"/>
    <path d="M 176 172 Q 214 150 254 176 Q 236 198 202 194 Q 184 188 176 172 Z" fill="none" stroke="#4fc3f7" stroke-width="2" opacity="0.9"/>

    <ellipse cx="72" cy="186" rx="30" ry="16" fill="url(#fluidDG)"/>
    <path d="M 50 190 Q 74 176 96 192 Q 78 204 58 200 Q 50 196 50 190 Z" fill="#031426" opacity="0.8"/>
    <path d="M 50 190 Q 74 176 96 192 Q 78 204 58 200 Q 50 196 50 190 Z" fill="none" stroke="#4fc3f7" stroke-width="1.8" opacity="0.8"/>

    <!-- Arrow to gallbladder wall -->
    <g>
      <path d="M 158 46 L 124 112" fill="none" stroke="#ff8a65" stroke-width="2" stroke-linecap="round"/>
      <path d="M 124 114 L 125 105 L 133 108" fill="none" stroke="#ff8a65" stroke-width="2" stroke-linecap="round"/>
      <text x="152" y="40" font-family="Montserrat, Arial, sans-serif" font-size="9" font-weight="700" fill="#ff8a65">PAREDE ESPESSADA</text>
    </g>

    <text x="14" y="20" font-family="Montserrat, Arial, sans-serif" font-size="10" font-weight="700"
          fill="#abce5f" opacity="0.95">ULTRASSOM • ABDOME</text>
    <text x="286" y="20" font-family="Montserrat, Arial, sans-serif" font-size="10" font-weight="700"
          fill="#abce5f" opacity="0.95" text-anchor="end">FIGADO</text>
    <text x="216" y="216" font-family="Montserrat, Arial, sans-serif" font-size="9" font-weight="700"
          fill="#4fc3f7" text-anchor="middle" opacity="0.95">LIQUIDO LIVRE</text>
  </g>

  <!-- Right side: thermometer + droplets + probe -->
  <g transform="translate(560 66)">
    <!-- Thermometer -->
    <g opacity="0.9">
      <rect x="20" y="0" width="16" height="88" rx="8" fill="#ffffff" opacity="0.9"/>
      <circle cx="28" cy="100" r="15" fill="#ff8a65" opacity="0.95"/>
      <rect x="24" y="36" width="8" height="58" rx="4" fill="#ff8a65" opacity="0.95"/>
      <path d="M 40 20 L 50 20" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
      <path d="M 40 34 L 48 34" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
      <path d="M 40 48 L 50 48" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
      <path d="M 40 62 L 48 62" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    </g>

    <!-- Droplets (extravasamento plasmatico) -->
    <g opacity="0.85">
      <path d="M 96 26 Q 108 44 96 54 Q 84 44 96 26 Z" fill="#4fc3f7" opacity="0.8"/>
      <path d="M 126 58 Q 136 73 126 82 Q 116 73 126 58 Z" fill="#4fc3f7" opacity="0.6"/>
      <path d="M 92 84 Q 100 96 92 104 Q 84 96 92 84 Z" fill="#4fc3f7" opacity="0.5"/>
    </g>

    <!-- Probe -->
    <g transform="translate(60 140)">
      <rect x="10" y="0" width="42" height="60" rx="12" fill="#ffffff" opacity="0.95"/>
      <rect x="18" y="12" width="26" height="30" rx="6" fill="#005a87" opacity="0.85"/>
      <rect x="10" y="60" width="42" height="11" rx="4" fill="#abce5f" opacity="0.9"/>
      <path d="M 31 0 Q 31 -18 54 -24" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
      <g stroke="#abce5f" fill="none" stroke-linecap="round" opacity="0.6">
        <path d="M 14 84 Q 31 96 48 84" stroke-width="3"/>
        <path d="M 6 100 Q 31 118 56 100" stroke-width="3" opacity="0.75"/>
      </g>
      <circle cx="31" cy="78" r="3" fill="#c8e47a" opacity="0.85"/>
    </g>

    <circle cx="4" cy="150" r="2.5" fill="#abce5f" opacity="0.7"/>
    <circle cx="150" cy="132" r="2" fill="#c8e47a" opacity="0.6"/>
    <circle cx="16" cy="196" r="2" fill="#abce5f" opacity="0.55"/>
  </g>

  <text x="400" y="325" font-family="Montserrat, Arial, sans-serif" font-size="24" font-weight="800"
        fill="#ffffff" text-anchor="middle">Dengue e os sinais de alarme</text>

  <text x="400" y="358" font-family="Open Sans, Arial, sans-serif" font-size="14" font-weight="400"
        fill="#c8e47a" text-anchor="middle">O papel do ultrassom de abdome na avaliacao do paciente</text>

  <rect x="260" y="372" width="280" height="3" rx="1.5" fill="url(#accentDG)" opacity="0.85"/>
</svg>
